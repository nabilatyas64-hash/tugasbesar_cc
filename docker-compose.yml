services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pendekin_app
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      PORT: 8000
      BASE_URL: http://localhost:8000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: pendekin
      DB_USER: pendekin
      DB_PASSWORD: pendekin123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_TTL_SECONDS: 3600
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: pendekin_db
    environment:
      MYSQL_DATABASE: pendekin
      MYSQL_USER: pendekin
      MYSQL_PASSWORD: pendekin123
      MYSQL_ROOT_PASSWORD: rootpassword123
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "pendekin", "-ppendekin123"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pendekin_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
